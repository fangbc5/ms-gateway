services:
  ms-gateway:
    image: ms-gateway:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # 挂载路由配置（Nacos 未启用时使用）
      - ./routes.toml:/app/routes.toml:ro
    extra_hosts:
      # Linux 上需要此配置访问宿主机服务
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - fbc-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  fbc-network:
    external: true
