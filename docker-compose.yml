services:
  ms-gateway:
    image: ms-gateway:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-gateway
    ports:
      - "8080:8080"
    environment:
      # 日志级别
      - RUST_LOG=${RUST_LOG:-info}
      # 网关监听地址
      - GATEWAY_BIND=0.0.0.0:8080
      # JWT 解码密钥
      - JWT_DECODING_KEY=${JWT_DECODING_KEY:-AqSsVZfOXg9hwmFpaDet}
      # 限流配置
      - GLOBAL_QPS=${GLOBAL_QPS:-1000}
      - CLIENT_QPS=${CLIENT_QPS:-100}
      # 请求超时（秒）
      - REQUEST_TIMEOUT_SECS=${REQUEST_TIMEOUT_SECS:-10}
      # CORS 配置（* 表示允许所有源）
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      # ========== Nacos 集成（可选） ==========
      - NACOS__ENABLED=true
      - NACOS__SERVER_ADDRS=host.docker.internal:8848
      - NACOS__USERNAME=nacos
      - NACOS__PASSWORD=nacos
      # 配置中心
      - NACOS__CONFIG_NAMESPACE=0f158f76-45a3-4ce0-ae65-b1403594e420
      - NACOS__ROUTES_DATA_ID=ms-gateway
      # 服务注册/发现
      - NACOS__NAMING_NAMESPACE=0f158f76-45a3-4ce0-ae65-b1403594e420
      - NACOS__REGISTER_ENABLED=true
      - NACOS__SERVICE_NAME=ms-gateway
    volumes:
      # 挂载路由配置（Nacos 未启用时使用）
      - ./routes.toml:/app/routes.toml:ro
    extra_hosts:
      # Linux 上需要此配置访问宿主机服务
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - fbc-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  fbc-network:
    external: true
