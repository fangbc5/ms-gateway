[package]
name = "ms-gateway"
version = "0.1.0"
edition = "2021"

# 生产构建优化配置
[profile.release]
# 启用链接时优化（LTO），生成更小更快的二进制
lto = true
# 单 codegen 单元，允许更激进的优化
codegen-units = 1
# 剥离调试符号，大幅减小二进制体积
strip = true
# panic 时直接中止，减少 unwinding 代码体积
panic = "abort"
# 最高优化等级
opt-level = 3

[dependencies]
# Web 框架
axum = "0.7"

# Tokio 运行时，启用 signal
tokio = { version = "1.47", features = ["full", "signal"] }

# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "stream"] }

# JSON 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# JWT 认证
jsonwebtoken = "9.3.1"

# 限流
governor = "0.6"
nonzero_ext = "0.3"
once_cell = "1.19"

# 日志 & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# HTTP 中间件
tower-http = { version = "0.6", features = ["cors"] }

# 错误处理
anyhow = "1.0"
thiserror = "1"

# 配置
dotenvy = "0.15.7"
config = "0.15.16"

# prometheus
prometheus = "0.14.0"

# 路径匹配
regex = "1.10"

# 并发的容器
dashmap = "6.1.0"

# 负载均衡器依赖
arc-swap = "1.7.1"
rand = "0.8"

# WebSocket 支持
tokio-tungstenite = "0.24"
futures-util = "0.3"
hyper = "1.5"
hyper-util = { version = "0.1", features = ["tokio"] }
sha1 = "0.10"
base64 = "0.22"
notify = "6"

# 静态编译 OpenSSL（musl 全静态链接需要）
openssl = { version = "0.10", features = ["vendored"] }
uuid = { version = "1.22.0", features = ["v4", "fast-rng"] }

# Nacos 服务注册/发现 + 配置中心
nacos_rust_client = "0.3"
toml = "0.8"
