# ========== 认证服务 ==========
[[routes]]
prefix = ["/api/v1/auth/**"]
service_name = "ms-auth"
whitelist = ["/api/v1/auth/login", "/api/v1/auth/register", "/api/v1/auth/send-code", "/api/v1/auth/captcha", "/api/v1/auth/refresh-token"]

# ========== 身份管理服务 ==========
[[routes]]
prefix = ["/api/v1/identity/**"]
service_name = "ms-identity"

# ========== 对象存储服务 ==========
[[routes]]
prefix = ["/api/v1/oss/**"]
service_name = "ms-oss"

# ========== WebSocket 服务 ==========
[[routes]]
prefix = ["/ws", "/ws/**", "/wss", "/wss/**"]
service_name = "ms-websocket"

# ms-websocket 测试接口
[[routes]]
prefix = ["/api/test/**"]
service_name = "ms-websocket"
whitelist = ["/api/test/**"]

# ========== 健康检查 ==========
[health_check]
enabled = true
interval_secs = 10
timeout_secs = 3
path = "/health"
unhealthy_threshold = 3
healthy_threshold = 2