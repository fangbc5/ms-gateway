# 多前缀匹配，多上游轮询
[[routes]]
prefix = ["/auth/**", "/token/**", "/user/**"]
upstream = "http://host.docker.internal:30000"
whitelist = ["/auth/login","/auth/code/send","/auth/code/verify","/auth/register"]
[[routes]]
prefix = ["/ws", "/ws/**", "/wss", "/wss/**"]
upstream = ["http://host.docker.internal:30001"]
# 开放 WebSocket 路径的鉴权（示例：全部放行）
whitelist = ["/ws", "/ws/**", "/wss", "/wss/**"]

# ms-websocket 测试接口（推送消息、查询在线用户）
[[routes]]
prefix = ["/api/test/**"]
upstream = "http://host.docker.internal:30001"
whitelist = ["/api/test/**"]